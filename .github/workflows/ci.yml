name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhymepilot
          POSTGRES_PASSWORD: rhymepilot
          POSTGRES_DB: rhymepilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhymepilot" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: System packages (FFmpeg, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core libraqm0
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rhymepilot:rhymepilot@localhost:5432/rhymepilot_test
        run: python -m pytest -q
      - name: Tests (SQLite) incl. migrations
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-key-0123456789abcdefghij/' .env
      - run: docker compose build
      - run: docker compose up -d && sleep 40 && docker compose ps
      - run: python3 scripts/smoke_test.py --e2e --password ci-smoke-password-123
      - if: failure()
        run: docker compose logs --tail=200
